<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack The Spider</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            color: #ff0077;
            text-shadow: 0 0 10px #ff0077, 0 0 20px #ff0077;
            margin-top: 20px;
        }

        #score, #timer {
            text-align: center;
            font-size: 24px;
            margin: 10px;
            text-shadow: 0 0 5px #00ffcc;
        }

        #startBtn {
            display: block;
            margin: 0 auto 20px auto;
            padding: 12px 25px;
            font-size: 18px;
            background-color: #222;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            text-shadow: 0 0 3px #00ffcc;
        }

        #startBtn:hover {
            background-color: #00ffcc;
            color: #111;
            box-shadow: 0 0 10px #00ffcc;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #game div {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #game div:active {
            transform: scale(1.2);
        }
        #customAlert {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        
        #alertBox {
            background-color: #1a1a1a;
            border: 2px solid #ff0077;
            color: #00ffcc;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            font-size: 20px;
            box-shadow: 0 0 20px #ff0077;
            animation: popup 0.4s ease;
        }
        
        #alertBox button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00ffcc;
            color: #111;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        #alertBox button:hover {
            background-color: #ff0077;
            color: white;
        }
        
        @keyframes popup {
            from {
                transform: scale(0.6);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        #game {
            position: relative;
            width: 1000px;
            height: 450px;
            margin: 0 auto;
            border: 3px dashed #00ffcc;
            border-radius: 15px;
            background-color: #222;
            overflow: hidden;
        }
        
        
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯Whack The Spider🎯</h1>
        <div id="score">Score: 0</div>
        <div id="timer">Time Left: 30s</div>
        <button id="startBtn">Start Game</button>
        <div id="game"></div>
    </div>

    <div id="customAlert">
        <div id="alertBox">
            <p id="alertMessage"></p>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>
    

    <script>
        const gameArea = document.getElementById("game");
        const scoreDisplay = document.getElementById("score");
        const timerDisplay = document.getElementById("timer");
        const startBtn = document.getElementById("startBtn");

        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let moveInterval;

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = "Score: 0";
            timerDisplay.textContent = "Time Left: 30s";
            startBtn.disabled = true;

            let spider = document.createElement("div");
            spider.textContent = "🕷️";
            spider.style.position = "absolute";
            spider.style.fontSize = "40px";
            spider.style.cursor = "pointer";
            gameArea.appendChild(spider);

            moveInterval = setInterval(() => {
                const gameRect = gameArea.getBoundingClientRect();
                const x = Math.random() * (gameRect.width - 40);
                const y = Math.random() * (gameRect.height - 40);
                spider.style.left = `${x}px`;
                spider.style.top = `${y}px`;
            }, 1500);
            
            spider.addEventListener("click", () => {
                score++;
                scoreDisplay.textContent = "Score: " + score;
                spider.textContent = "💥";
                setTimeout(() => {
                    spider.textContent = "🕷️";
                }, 300);
            });

            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Time Left: ${timeLeft}s`;
                if (timeLeft === 0) {
                    clearInterval(gameInterval);
                    clearInterval(moveInterval);
                    spider.remove();
                    startBtn.disabled = false;
                    showCustomAlert("⏰ Time's up! Your score is: " + score);
                }
            }, 1000);
        }
        function showCustomAlert(message) {
            const alertBox = document.getElementById("customAlert");
            const alertMessage = document.getElementById("alertMessage");
            alertMessage.textContent = message;
            alertBox.style.display = "flex";
        }
        
        function closeAlert() {
            document.getElementById("customAlert").style.display = "none";
        }
        

        startBtn.addEventListener("click", startGame);
    </script>
</body>
</html>
